[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-agent-project"
version = "0.1.0"
description = "Production-ready AML agent for bank statement analysis"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-gigachat>=0.3.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.0.0",
  "sqlalchemy>=2.0.0",
  "faiss-cpu>=1.8.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
  "python-dotenv>=1.0.0",
  "openpyxl>=3.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
